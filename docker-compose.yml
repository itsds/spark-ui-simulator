# One-command local stack: History Server + mock YARN NodeManager log server. Phase 7 adds the portal.
# Not yet verified (no Docker daemon in the cloud dev container).
#
#   docker compose up                                        # browse generated scenarios (./event-logs)
#   EVENT_LOG_DIR=./reference/event-logs docker compose up   # browse real reference captures
services:
  history-server:
    image: apache/spark:3.5.9-java17
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_CONF_DIR: /opt/hs-conf
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=file:///event-logs"
    volumes:
      - ./services/history-server/spark-defaults.conf:/opt/hs-conf/spark-defaults.conf:ro
      - ${EVENT_LOG_DIR:-./event-logs}:/event-logs:ro
    ports:
      - "18080:18080"
  nm-logs:
    image: python:3.11-slim
    command: ["python3", "/srv/nm-logs/server.py", "--dir", "/yarn-logs", "--port", "8042"]
    volumes:
      - ./services/nm-logs:/srv/nm-logs:ro
      - ${YARN_LOG_DIR:-./yarn-logs}:/yarn-logs:ro
    ports:
      - "8042:8042"
