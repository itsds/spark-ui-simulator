# Spark History Server configuration (shared by run.sh and docker-compose).
# spark.history.fs.logDirectory is supplied at start-up by the launcher.
spark.history.ui.port                 18080
spark.history.fs.update.interval      5s
spark.history.fs.cleaner.enabled      false
spark.history.retainedApplications    50
# Executor/driver stdout/stderr links: the mock NodeManager log server (services/nm-logs, port 8042)
# instead of the (unreachable) NodeManager hosts in the event log. YARN attributes are template variables.
spark.history.custom.executor.log.url http://localhost:8042/node/containerlogs/{{CONTAINER_ID}}/{{USER}}/{{FILE_NAME}}?start=-4096
