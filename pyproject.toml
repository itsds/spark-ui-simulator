[project]
name = "sparksim"
version = "0.1.0"
description = "Generate production-scale Spark event logs for practising debugging in the real Spark History Server"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "markdown-it-py>=3,<5",  # scenario portal: ticket, hints, solution
    "numpy>=1.26,<2",  # shuffle block matrices (also pinned <2 by the PySpark reference group)
    "pydantic>=2.6,<3",  # scenario.yaml schema
    "pyyaml>=6",  # scenario.yaml
]

[project.scripts]
sparksim = "sparksim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "requests>=2.31",
]
# Real Spark — only used to capture reference event logs and to run the History Server locally.
reference = [
    "pyspark==3.5.9",
    "pandas>=2.0,<2.3",
    "pyarrow>=14,<18",
    "numpy<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparksim"]

[tool.uv]
default-groups = ["dev", "reference"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Java + PySpark (starts a real Spark History Server)",
]
